name: smoke

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://ancientpaths.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
